[package]
name = "radialactions"
version = "1.0.0"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "gif", "tiff"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Data_Pdf", "Media_Ocr", "Graphics_Imaging", "Globalization", "Foundation_Collections", "Storage", "Storage_Streams", "Foundation"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
toml = "1.1.8"
sha2 = "0.11.1"
tar = "0.4.46"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
lopdf = "0.46.0"
roxmltree = "0.21.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
